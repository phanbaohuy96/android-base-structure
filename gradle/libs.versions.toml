[versions]
activity = "1.13.0"
agp = "8.13.2"
androidx-security = "1.1.0"
coil = "3.5.0"
compose-bom = "2026.06.01"
coroutines = "1.10.2"
datastore = "1.1.7"
detekt = "2.0.0-alpha.5"
hilt = "2.57.2"
hilt-navigation-compose = "1.3.0"
junit = "4.13.2"
kotlin = "2.2.21"
kotlinx-serialization-json = "1.9.0"
kover = "0.9.8"
ksp = "2.2.21-2.0.5"
ktlint = "1.7.1"
lifecycle = "2.10.0"
mockk = "1.14.6"
navigation = "2.9.8"
okhttp = "5.4.0"
retrofit = "3.0.0"
